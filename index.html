<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="속도를 예술로 기록하는 시각 디자이너, 김창완의 포트폴리오">
    <title>김창완 | Visual Designer Portfolio</title>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', sans-serif;
            line-height: 1.6;
            background-color: #FFFFFF;
            color: #000;
        }

        a { text-decoration: none; }
        img { max-width: 100%; height: auto; display: block; }

        /* ================= NAV ================= */
        nav {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 5vw;
            backdrop-filter: blur(6px);
            transition: background-color 0.3s ease;
        }

        .nav-logo {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 3px;
            color: #fff;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 28px;
        }

        nav a { color: #fff; font-size: 13px; }

        .nav-solid {
            background: rgba(0,0,0,0.9);
            border-bottom: 1px solid rgba(255,255,255,0.12);
        }

        /* ================= HERO ================= */
        .hero {
            height: 100vh;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 5vw;
            background: #000;
            color: #fff;
        }

        .hero-inner { max-width: 50%; }

        .hero-title-main {
            font-size: 56px;
            font-weight: 800;
            margin-bottom: 20px;
        }

        .hero-visual img {
            max-height: 85vh;
        }

        /* ================= COMMON SECTION ================= */
        section:not(.hero) {
            max-width: 1400px;
            margin: 0 auto;
            padding: 120px 6vw;
        }

        h2 {
            font-size: 48px;
            margin-bottom: 80px;
            text-align: center;
        }

        /* ================= PROJECTS ================= */
        /* ✅ 실제로 사용 */
        .projects-wrap {
            display: flex;
            flex-direction: column;
            gap: 120px; /* ← 프로젝트 사이 여백 */
        }

        .project-fullwrap {
            max-width: 1100px;
            margin: 0 auto;
        }

        .project-banner {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            overflow: hidden;
            border-radius: 8px;
        }

        .project-banner img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
        }

        .project-banner:hover img {
            transform: scale(1.03);
        }

        /* project2 보정 */
        .project-banner.project2 img {
            transform: scale(1.12);
        }

        .project-banner.project2:hover img {
            transform: scale(1.15);
        }

        .project-banner-info {
            position: absolute;
            left: 6%;
            bottom: 12%;
            max-width: 60%;
            color: #fff;
            text-shadow: 0 2px 6px rgba(0,0,0,0.7);
        }

        .project-banner-info h3 {
            font-size: 26px;
            margin-bottom: 10px;
        }

        .project-banner-info p {
            font-size: 14px;
            line-height: 1.8;
        }

        /* ================= CONTACT ================= */
        footer {
            text-align: center;
            padding: 40px 20px;
            border-top: 1px solid #000;
        }
    </style>
</head>

<body>

<nav>
    <div class="nav-logo">ILLUSTRACE</div>
    <ul>
        <li><a href="#home">Home</a></li>
        <li><a href="introduce.html">Introduce</a></li>
        <li><a href="slogan.html">Slogan</a></li>
        <li><a href="character.html">Character</a></li>
    </ul>
</nav>

<section id="home" class="hero">
    <div class="hero-inner">
        <h1 class="hero-title-main">속도를 예술로 기록하는<br>시각 디자이너, 김창완</h1>
    </div>
    <div class="hero-visual">
        <img src="images/background-profile2.jpg" alt="">
    </div>
</section>

<section id="projects">
    <h2>Projects</h2>

    <!-- ✅ 여기 중요 -->
    <div class="projects-wrap">

        <div class="project-fullwrap">
            <div class="project-banner project2">
                <img src="images/project1.jpg" alt="">
                <div class="project-banner-info">
                    <h3>ILLUST x RACE : 감성과 속도의 결합</h3>
                    <p>붓의 질감과 레이스의 속도를 하나의 리듬으로 표현한 프로젝트</p>
                </div>
            </div>
        </div>

        <div class="project-fullwrap">
            <div class="project-banner project2">
                <img src="images/project2.png" alt="">
                <div class="project-banner-info">
                    <h3>레드·블루 붓터치 패턴</h3>
                    <p>속도감을 시각적으로 응축한 그래픽 패턴</p>
                </div>
            </div>
        </div>

        <div class="project-fullwrap">
            <div class="project-banner">
                <img src="images/project03.jpg" alt="">
                <div class="project-banner-info">
                    <h3>서킷 트레일 비주얼</h3>
                    <p>‘속도를 그림으로 기록한다’는 철학의 시각화</p>
                </div>
            </div>
        </div>

    </div>
</section>

<footer>
    © 2025 김창완
</footer>

<script>
    const nav = document.querySelector('nav');
    window.addEventListener('scroll', () => {
        nav.classList.toggle('nav-solid', window.scrollY > 40);
    });
</script>

</body>
</html>
