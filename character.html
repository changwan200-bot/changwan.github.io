<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="ILLUSTRACE 캐릭터 소개 페이지" />
  <title>ILLUSTRACE | Character</title>

  <style>
    /* ===========================
       RESET
    ============================ */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', sans-serif;
      background-color: #ffffff;
      color: #000000;
      line-height: 1.7;
    }

    img { max-width: 100%; display: block; }
    a { text-decoration: none; color: inherit; }
    button { border: none; background: none; padding: 0; cursor: pointer; }

    /* ===========================
       NAV
    ============================ */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 1000;
      display: flex;
      justify-content: flex-end;
      padding: 16px 5vw;
      color: #fff;
      transition: background-color 0.3s;
    }
    nav ul { list-style: none; display: flex; gap: 32px; }
    .nav-solid { background-color: rgba(0,0,0,0.9); }

    /* ===========================
       HERO
    ============================ */
    .hero {
      height: 420px;
      background: url("images/project13.png") center/cover;
      position: relative;
    }
    .hero-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, rgba(0,0,0,.55), rgba(0,0,0,.1));
    }

    /* ===========================
       MAIN
    ============================ */
    .page-wrap {
      max-width: 1100px;
      margin: 0 auto;
      padding: 80px 6vw 120px;
    }

    .section { margin-bottom: 80px; }
    .section-title { font-size: 28px; font-weight: 700; margin-bottom: 24px; }

    /* ===========================
       GALLERY
    ============================ */
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }

    .gallery-item {
      position: relative;
      border-radius: 12px;
      overflow: hidden;
      background: #f5f5f5;
    }

    .gallery-item img {
      width: 100%;
      height: 260px;
      object-fit: cover;
    }

    .gallery-caption {
      position: absolute;
      left: 10px;
      bottom: 10px;
      background: rgba(0,0,0,0.65);
      padding: 4px 10px;
      font-size: 11px;
      color: #fff;
      border-radius: 999px;
    }

    /* ===========================
       VIDEO MODAL
    ============================ */
    .video-modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 2000;
    }

    .video-modal.active { display: flex; }

    .video-wrap {
      position: relative;
      width: min(90vw, 960px);
      aspect-ratio: 16 / 9;
      background: #000;
    }

    .video-wrap video {
      width: 100%;
      height: 100%;
    }

    .video-close {
      position: absolute;
      top: -40px;
      right: 0;
      color: #fff;
      font-size: 14px;
      cursor: pointer;
      opacity: 0.8;
    }
    .video-close:hover { opacity: 1; }

    @media (max-width: 900px) {
      .gallery-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 520px) {
      .gallery-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>

<body>

<nav id="top-nav">
  <ul>
    <li><a href="index.html#home">Home</a></li>
    <li><a href="index.html#about">Introduce</a></li>
    <li><a href="slogan.html">Slogan</a></li>
    <li><a href="character.html">Character</a></li>
  </ul>
</nav>

<header class="hero">
  <div class="hero-overlay"></div>
</header>

<main class="page-wrap">

  <section class="section">
    <h2 class="section-title">캐릭터 비주얼 갤러리</h2>

    <div class="gallery-grid">
      <div class="gallery-item">
        <img src="images/project9.png" alt="">
        <div class="gallery-caption">POSE STUDY – 01</div>
      </div>

      <div class="gallery-item">
        <img src="images/project10.png" alt="">
        <div class="gallery-caption">POSE STUDY – 02</div>
      </div>

      <div class="gallery-item">
        <img src="images/project11.png" alt="">
        <div class="gallery-caption">POSE STUDY – 03</div>
      </div>

      <!-- ★ 클릭 시 영상 재생 -->
      <div class="gallery-item">
        <button id="openVideo">
          <img src="images/project15.jpg" alt="Pit Stop">
        </button>
        <div class="gallery-caption">RACE MODE – PIT STOP</div>
      </div>

      <div class="gallery-item">
        <img src="images/project06.jpg" alt="">
        <div class="gallery-caption">RACE MODE – FRONT</div>
      </div>

      <div class="gallery-item">
        <img src="images/project16.jpg" alt="">
        <div class="gallery-caption">RACE MODE – CONFERENCE</div>
      </div>
    </div>
  </section>

</main>

<!-- VIDEO MODAL -->
<div class="video-modal" id="videoModal">
  <div class="video-wrap">
    <div class="video-close" id="closeVideo">✕ Close</div>
    <video id="pitStopVideo" src="videos/pit-stop-video.mp4" controls></video>
  </div>
</div>

<script>
  const nav = document.getElementById('top-nav');
  window.addEventListener('scroll', () => {
    nav.classList.toggle('nav-solid', window.scrollY > 40);
  });

  const openBtn = document.getElementById('openVideo');
  const modal = document.getElementById('videoModal');
  const video = document.getElementById('pitStopVideo');
  const closeBtn = document.getElementById('closeVideo');

  openBtn.addEventListener('click', () => {
    modal.classList.add('active');
    video.play();
  });

  closeBtn.addEventListener('click', closeVideo);
  modal.addEventListener('click', e => {
    if (e.target === modal) closeVideo();
  });

  function closeVideo() {
    modal.classList.remove('active');
    video.pause();
    video.currentTime = 0;
  }
</script>

</body>
</html>
